<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="monospace">
  <title id="t">Demo system overview</title>
  <desc id="d">A web UI calls an API that uses auth, a cache and a job queue feeding a worker and a database.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="800" height="520" fill="#faf8f4"/>
  <text x="40" y="36" font-size="16" font-weight="700" fill="#1a1a1a">DEMO · SYSTEM OVERVIEW</text>
  <g class="zone" id="zone-front" fill="none" stroke="#1a1a1a"><rect x="40" y="76" width="680" height="96" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/></g>
  <g class="zone" id="zone-back" fill="none" stroke="#1a1a1a"><rect x="40" y="416" width="680" height="96" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/></g>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <path class="edge" id="e-web-api" d="M252,124 H320" marker-end="url(#ah)"/>
    <path class="edge" id="e-api-auth" d="M512,124 H580" marker-end="url(#ah)"/>
    <path class="edge" id="e-api-cache" d="M320,140 H156 V262" marker-end="url(#ah)"/>
    <path class="edge" id="e-api-queue" d="M416,156 V262" marker-end="url(#ah)"/>
    <path class="edge" id="e-queue-worker" d="M416,326 V432" marker-end="url(#ah)"/>
    <path class="edge" id="e-worker-db" d="M512,464 H580" marker-end="url(#ah)"/>
    <path class="edge" id="e-auth-db" d="M676,156 V432" marker-end="url(#ah)"/>
  </g>
  <g class="node" id="n-web">
    <rect x="60" y="92" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="156" y="122" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Web UI</text>
    <text x="156" y="140" font-size="10" text-anchor="middle" fill="#1a1a1a">browser</text>
  </g>
  <g class="node" id="n-api">
    <rect x="320" y="92" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="416" y="122" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">API</text>
    <text x="416" y="140" font-size="10" text-anchor="middle" fill="#1a1a1a">gateway</text>
  </g>
  <g class="node" id="n-auth">
    <rect x="580" y="92" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="676" y="122" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Auth</text>
    <text x="676" y="140" font-size="10" text-anchor="middle" fill="#1a1a1a">tokens</text>
  </g>
  <g class="node" id="n-queue">
    <rect x="320" y="262" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="416" y="292" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Queue</text>
    <text x="416" y="310" font-size="10" text-anchor="middle" fill="#1a1a1a">jobs</text>
  </g>
  <g class="node" id="n-worker">
    <rect x="320" y="432" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="416" y="462" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Worker</text>
    <text x="416" y="480" font-size="10" text-anchor="middle" fill="#1a1a1a">background</text>
  </g>
  <g class="node" id="n-db">
    <rect x="580" y="432" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="676" y="462" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Database</text>
    <text x="676" y="480" font-size="10" text-anchor="middle" fill="#1a1a1a">storage</text>
  </g>
  <g class="node" id="n-cache">
    <rect x="60" y="262" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="156" y="292" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Cache</text>
    <text x="156" y="310" font-size="10" text-anchor="middle" fill="#1a1a1a">hot data</text>
  </g>
</svg>
